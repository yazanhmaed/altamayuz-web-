<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="متجر أحذية — كاش عند الاستلام">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="التميز للجلود الطبيعية المميزة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>التميز للجلود الطبيعية المميزة</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background-color: #F6F3EC; height: 100%; }
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-logo">التميز للجلود الطبيعية المميزة</div>
    <div id="splash-spinner"></div>
  </div>
  <style>
    /* Colors duplicated from AppColors in storefront/lib/theme/app_theme.dart
       (this file can't import Dart constants) — keep in sync if the palette
       changes: bg #F6F3EC, textPrimary #1E1B16, border #E4E0D6, accent #1F3A3D. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #F6F3EC;
      z-index: 9999;
    }
    #splash-logo {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #1E1B16;
    }
    #splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E4E0D6;
      border-top-color: #1F3A3D;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function () {
      function removeSplash() {
        var el = document.getElementById('splash');
        if (el) el.remove();
      }
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
      // Defensive fallback in case the event above never fires.
      setTimeout(removeSplash, 15000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
