<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منتجات تركية عالية الجودة بصناعة مصرية فاخرة">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="التميز للجلود الطبيعية المميزة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>التميز للجلود الطبيعية المميزة</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background-color: #F6F3EC; height: 100%; width: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    @supports (height: 100dvh) { body { height: 100dvh; } }
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-logo">التميز للجلود الطبيعية المميزة</div>
    <div id="splash-spinner"></div>
  </div>
  <style>
    /* Colors duplicated from AppColors in storefront/lib/theme/app_theme.dart
       (this file can't import Dart constants) — keep in sync if the palette
       changes: bg #F6F3EC, textPrimary #1E1B16, border #E4E0D6, accent #1F3A3D. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #F6F3EC;
      z-index: 9999;
    }
    #splash-logo {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #1E1B16;
    }
    #splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E4E0D6;
      border-top-color: #1F3A3D;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function () {
      function removeSplash() {
        var el = document.getElementById('splash');
        if (el) el.remove();
      }
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
      // Defensive fallback in case the event above never fires.
      setTimeout(removeSplash, 15000);
    })();
  </script>
  <script>
    // Mobile keyboard: undo the leftover blank space/scroll offset browsers
    // keep after the keyboard closes, and make Flutter re-read its metrics.
    (function () {
      var VP = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content';
      function isInput(el) {
        return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
      }
      function resetScroll() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
      }
      document.addEventListener('focusout', function (e) {
        if (!isInput(e.target)) return;
        setTimeout(function () {
          if (!isInput(document.activeElement)) resetScroll();
        }, 100);
      });
      var vv = window.visualViewport, keyboardOpen = false;
      if (vv) {
        vv.addEventListener('resize', function () {
          var closed = Math.abs(window.innerHeight - vv.height) < 50;
          if (closed && keyboardOpen) {
            resetScroll();
            window.dispatchEvent(new Event('resize'));
          }
          keyboardOpen = !closed;
        });
      }
      // Flutter's engine replaces any viewport meta with its own on startup,
      // dropping interactive-widget — re-apply ours once it has run.
      window.addEventListener('flutter-first-frame', function () {
        var m = document.querySelector('meta[name="viewport"]');
        if (m) m.setAttribute('content', VP);
      }, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
